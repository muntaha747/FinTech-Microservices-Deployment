# =====================================================================================
# kind cluster: 1 control-plane + 10 workers | NO default CNI (Calico) | 122 host ports
# =====================================================================================
# Create : kind create cluster --config /home/muntaha/DevOps/WezvaTech/kind-config.yaml
# CNI    : kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.3/manifests/tigera-operator.yaml
#          kubectl apply  -f /home/muntaha/DevOps/WezvaTech/calico-custom-resources.yaml
# Delete : kind delete cluster --name fintech-cluster
#
# HOW PORTS WORK
#   browser -> localhost:<hostPort> -> control-plane container:<containerPort>
#           -> kube-proxy -> Service with that NodePort -> your pod (on ANY node)
#   So set your Service to "type: NodePort" + "nodePort: <one of the ports below>".
#   Ports can NOT be added to a running kind cluster; change this file + recreate.
#
# PORT PLAN (NodePort range is 30000-32767) - 122 ports, 20 per group
#   80, 443       ingress controller (ingress-nginx), needs the host nginx STOPPED
#                 TIP: with ingress you can add UNLIMITED tools on port 80 by hostname,
#                 e.g. grafana.localhost, argocd.localhost (no new ports needed)
#   30000-30019   general use; lab: 30000 = Prometheus
#   30100-30119   observability UIs; lab: 30100 = Grafana (Loki, Alertmanager, Jaeger, Kiali, OpenSearch...)
#   31000-31019   apps ACTIVE; lab: 31000 = ledger app active / Falcosidekick UI
#   31100-31119   apps PREVIEW; lab: 31100 = ledger app preview (blue-green)
#   32000-32019   CD / GitOps tools; lab: 32000 = ArgoCD UI (Argo Rollouts dashboard, Jenkins...)
#   32100-32119   security + spare (Vault UI, SonarQube, Kubernetes dashboard...)
# =====================================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fintech-cluster
networking:
  disableDefaultCNI: true        # no kindnet; install Calico after creating the cluster
  podSubnet: "10.244.0.0/16"     # MUST match the Calico IPPool cidr (calico-custom-resources.yaml)
                                 # NOT 192.168.0.0/16: clashes with home Wi-Fi 192.168.0.0/24
nodes:
  - role: control-plane
    image: mirror.gcr.io/kindest/node:v1.35.1@sha256:05d7bcdefbda08b4e038f644c4df690cdac3fba8b06f8289f30e10026720a1ab
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # --- ingress ---
      - { containerPort: 80,    hostPort: 80,    protocol: TCP }
      - { containerPort: 443,   hostPort: 443,   protocol: TCP }
      # --- general 30000-30019 ---
