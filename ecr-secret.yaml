# ECR image-pull secret for the "demo" namespace (template - no real token stored here)
#
# Usage (token expires every 12 hours, re-run all of this to refresh):
#   export REGION=us-east-1
#   export ACCOUNT=$(aws sts get-caller-identity --query 'Account' --output text)
#   export TOKEN=$(aws ecr get-authorization-token --region $REGION --output text --query 'authorizationData[0].authorizationToken' | base64 -d | cut -d: -f2)
#   envsubst < ecr-secret.yaml | kubectl apply -f -
#
# NOTE: variables must be EXPORTED, otherwise envsubst can't see them.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: Secret
metadata:
  name: ecr-secret
  namespace: demo
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com": {
          "username": "AWS",
          "password": "${TOKEN}"
        }
      }
    }
